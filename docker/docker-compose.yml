services:
  postgres:
    image: postgres:16
    container_name: blitzcast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blitzcast
      POSTGRES_PASSWORD: blitzcast
      POSTGRES_DB: blitzcast
    ports:
      - "5432:5432"
    volumes:
      - blitzcast-pgdata:/var/lib/postgresql/data

volumes:
  blitzcast-pgdata:
